name: Build EPKs and HTML

# A newer commit supersedes older builds; do not spend runner time compiling stale revisions.
concurrency:
  group: build-epks-and-html-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ main, 'fix/**' ]
    paths:
      - '.github/workflows/**'
      - 'game/src/main/resources/**'
      - 'game/src/main/java/**'
      - 'game/build.gradle.kts'
      - 'platform/**'
      - 'platform-lwjgl/**'
      - 'platform-teavm/**'
      - 'platform-teavm/**'
      - 'target_lwjgl_desktop/**'
      - 'target_teavm/**'
      - 'target_teavm_wasm_gc/**'
      - 'target_teavm_wasm_gc_mesh/**'
      - 'target_teavm_wasm_gc_server/**'
      - 'wasm-toolchain/**'
      - 'build.gradle.kts'
      - 'gradlew'
      - 'settings.gradle.kts'
      - 'gradle.properties'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GRADLE_OPTS: "-Xmx14g -Dorg.gradle.jvmargs=-Xmx14g -Dfile.encoding=UTF-8"
      JAVA_TOOL_OPTIONS: "-Xmx14g"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Set up Gradle build cache
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle output cache directory
        run: mkdir -p .gradle

      # Restore prior task history and outputs. The exact key reuses a successful
      # build for unchanged inputs; the fallback restores the prior build so Gradle
      # can incrementally recompile only changed Java/resources.
      - name: Restore previous Gradle outputs
        uses: actions/cache@v4
        with:
          path: |
            .gradle
            game/build
            platform/build
            platform-lwjgl/build
            platform-teavm/build
            teavm-compat/build
            target_lwjgl_desktop/build
            target_teavm/build
            target_teavm_spike/build
            target_teavm_wasm_gc/build
            target_teavm_wasm_gc_mesh/build
            target_teavm_wasm_gc_server/build
          key: eagler-build-${{ runner.os }}-jdk25-${{ hashFiles('**/src/**/*.java', '**/src/**/*.kt', '**/*.gradle.kts', '**/src/main/resources/**', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties', 'wasm-toolchain/**') }}
          restore-keys: |
            eagler-build-${{ runner.os }}-jdk25-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build EPK assets and TeaVM web client
        run: |
          # Build all required outputs in one Gradle invocation so shared project tasks run only once.
          ./gradlew :target_lwjgl_desktop:buildAssetsEPK :target_lwjgl_desktop:buildAssetsEPKWithWebUnreachable :target_teavm:compileJava :target_teavm:processResources :target_teavm:classes :target_teavm:generateJavaScript --console=plain --no-daemon --build-cache --parallel --max-workers=2 -PeaglerObfuscated=false
        env:
          GRADLE_OPTS: "-Xmx14g -Dorg.gradle.jvmargs=-Xmx14g"

      - name: Prepare output directory
        run: |
          mkdir -p output
          find . -name "classes.js" -o -name "assets.epk" -o -name "eaglercraft*.html" -o -name "index.html" | head -40
          # Copy common TeaVM outputs
          find target_teavm/build -type f -name "classes.js" -exec cp -v {} output/ \;
          cp -v target_teavm/src/web/index.html output/
          cp -v target_teavm/build/epk/*.epk output/ 2>/dev/null || true
          cp -v target_lwjgl_desktop/build/epk/*.epk output/ 2>/dev/null || true
          test -s output/classes.js
          ls -lh output/

      - name: Commit and push to output/
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --cached --quiet || git commit -m "Build EPKs and HTML $(date -u +%Y%m%d-%H%M%S)"
          git push origin HEAD:main
